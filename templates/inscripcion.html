{% extends "base.html" %}

{% block title %}Inscripcion - Clase 1114{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">Inscripción a la Clase</h1>

        {% if mensaje %}
        <div class="alert alert-success shadow-sm">{{ mensaje }}</div>
        {% endif %}

        <form method="POST" class="needs-validation card p-4 shadow-sm border-0">
            <div class="mb-3">
                <label for="nombre" class="form-label fw-bold">Nombre:</label>
                <input type="text" class="form-control" name="nombre" id="nombre" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-bold">Email:</label>
                <input type="email" class="form-control" name="email" id="email" required>
            </div>

            <div class="mb-3">
                <label for="programa" class="form-label fw-bold">Programa:</label>
                <select name="programa" class="form-select" id="programa" required>
                    <option value="">-- Selecciona --</option>
                    <option value="Sistemas">Sistemas</option>
                    <option value="Ingenierias">Ingenierias</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold">Inscribirse</button>
        </form>
    </div>
</div>
{% endblock %}
