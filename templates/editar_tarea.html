{% extends "base.html" %}
{% block content %}
<form method="POST">
    <input type="text" name="titulo" value="{{ tarea.titulo }}" class="form-control" required>
    
    <textarea name="descripcion" class="form-control" required>{{ tarea.descripcion }}</textarea>
    
    <input type="number" name="calificacion" step="0.1" value="{{ tarea.calificacion or '' }}" class="form-control">
    
    <input type="date" name="fecha_entrega" value="{{ tarea.fecha_entrega.strftime('%Y-%m-%d') }}" class="form-control" required>
    
    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
</form>
{% endblock %}
